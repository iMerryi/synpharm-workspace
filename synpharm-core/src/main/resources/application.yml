server:
  # 沿用原 design 的端口：网关只有一条路由指向本服务，端口不变则网关改动最小
  port: ${SERVER_PORT:8083}

spring:
  application:
    # 服务名变化：Nacos 注册名、网关 lb:// 目标都要同步改
    name: synpharm-core

  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        fail-fast: false
      config:
        import-check:
          enabled: false

  # 设计域独占 schema（2026-11-04 起 platform / asset 已各自独立成库）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${CORE_DB_NAME:synpharm_core}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${CORE_DB_USER:synpharm_core}
    password: ${CORE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${CORE_DB_POOL_SIZE:20}

  # 设计域存在 SSE 长连接，不能按普通请求超时掐断（原 design 配置）
  mvc:
    async:
      request-timeout: -1

  # MQ：与 predict 共用 synpharm.exchange（direct, durable），队列与路由键见《03-实现级详细设计》§7
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:10}
        # 规范 §7：3 次指数退避后进 design.dlq；因此拒绝后不重新入队（否则会无限重投）
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
        default-requeue-rejected: false

  # 上传走 multipart：设计域本身不收文件（2026-11-04 起文件资产归 synpharm-asset），
  # 这里只保留与结构文件相关的较小上限，不再跟着 asset 一起放到 200MB
  servlet:
    multipart:
      max-file-size: ${CORE_MAX_FILE_SIZE:20MB}
      max-request-size: ${CORE_MAX_REQUEST_SIZE:25MB}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.synpharm.design.domain.model
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除：绝大多数表有 deleted 列（evaluation_result 是追加型结果表，没有）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

synpharm:
  internal:
    # 网关注入 X-Internal-Token 用的共享口令；未配置则本服务拒绝信任任何身份头（fail-closed）
    token: ${INTERNAL_TOKEN:}
  # 注意：原 design 的 synpharm.platform.base-url / connect-timeout-ms / read-timeout-ms 已删除。
  # 工具注册表 2026-11-04 起归 synpharm-platform，本服务不再持有它（也就没有对应的 HTTP 调用）。

# 计算层（FastAPI）：仅 ChemistryClient 用（/v1/evaluate/properties、/v1/chemistry/standardize）。
# 健康检查与能力探测已随 platform 迁出，health-*/probe-timeout 不再属于本服务。
fastapi:
  base-url: ${FASTAPI_URL:http://localhost:8000}
  api-key: ${FASTAPI_API_KEY:}
  # 化学计算比探测慢：500 个分子 × 14 指标约 1.5s，留足余量
  chemistry-timeout: ${FASTAPI_CHEMISTRY_TIMEOUT:60000}

knife4j:
  enable: ${KNIFE4J_ENABLED:true}
  setting:
    language: zh_cn

app:
  name: ${APP_NAME:SynPharm}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.synpharm: ${LOG_LEVEL:info}
